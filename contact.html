<!DOCTYPE html>
<html lang="en">

<head>


    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">


    <!-- Character encoding -->
    <meta charset="UTF-8">


    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- Page information -->

    <title>
        Contact | Harish Banjara
    </title>


    <meta name="description" content="Contact Harish Banjara through this portfolio website.">


</head>




<body>





    <!-- Header -->

    <header>
<button id="theme-toggle" aria-label="Toggle Theme">🌙</button>



        <h1>
            Contact Me
        </h1>




        <!-- Navigation -->

        <nav aria-label="Primary Navigation">


            <ul>


                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>


                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>


                <li>
                    <a href="projects.html">
                        Projects
                    </a>
                </li>


                <li>
                    <a href="contact.html" aria-current="page">
                        Contact
                    </a>
                </li>


            </ul>


        </nav>


    </header>







    <!-- Main Content -->

    <main>




        <section aria-labelledby="contact-heading">



            <h2 id="contact-heading">
                Send a Message
            </h2>






            <form id="contactForm" action="https://formspree.io/f/mlgkpqzq" method="POST">





                <label for="name">
                    Full Name
                </label>


                <input type="text" id="name" name="name" placeholder="Enter your name" required>






                <label for="email">
                    Email Address
                </label>


                <input type="email" id="email" name="email" placeholder="Enter your email" required>






                <label for="subject">
                    Subject
                </label>


                <input type="text" id="subject" name="subject" placeholder="Message subject">







                <label for="message">
                    Message
                </label>


                <textarea id="message" name="message" rows="5" placeholder="Write your message here"
                    required></textarea>







                <button type="submit">

                    Send Message

                </button>





            </form>






            <p id="form-message"></p>





        </section>





    </main>








    <!-- Footer -->

    <footer>


        <p>

            &copy; 2026 Harish Banjara. All Rights Reserved.

        </p>


    </footer>



<script>
document.addEventListener("DOMContentLoaded",()=>{
 const toggle=document.getElementById("theme-toggle");
 if(localStorage.getItem("theme")==="dark"){
   document.documentElement.setAttribute("data-theme","dark");
 }
 if(toggle){
   toggle.addEventListener("click",()=>{
     const theme=document.documentElement.getAttribute("data-theme");
     if(theme==="dark"){
       document.documentElement.removeAttribute("data-theme");
       localStorage.setItem("theme","light");
       toggle.textContent="🌙";
     }else{
       document.documentElement.setAttribute("data-theme","dark");
       localStorage.setItem("theme","dark");
       toggle.textContent="☀️";
     }
   });
 }
});
</script>

</body>

</html>
